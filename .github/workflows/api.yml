name: API

on:
  push:
    branches: [main]
    paths:
      - "src/GameChanger.Api/**"
      - "tests/GameChanger.Api.IntegrationTests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "GameChanger.slnx"
      - "global.json"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/GameChanger.Api/**"
      - "tests/GameChanger.Api.IntegrationTests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "GameChanger.slnx"
      - "global.json"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_PROJECT: src/GameChanger.Api/GameChanger.Api.csproj
  SOLUTION: GameChanger.slnx
  PUBLISH_DIRECTORY: artifacts/api

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            src/GameChanger.Api/packages.lock.json
            tests/GameChanger.Api.IntegrationTests/packages.lock.json

      - name: Restore
        run: dotnet restore $SOLUTION --locked-mode

      - name: Build
        run: dotnet build $SOLUTION --configuration Release --no-restore

      - name: Run tests
        run: dotnet test $SOLUTION --configuration Release --no-build --no-restore

      - name: Publish
        run: dotnet publish $API_PROJECT --configuration Release --no-build --output $PUBLISH_DIRECTORY

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: gamechanger-api
          path: ${{ env.PUBLISH_DIRECTORY }}
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: production-api
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v7
        with:
          name: gamechanger-api
          path: ${{ env.PUBLISH_DIRECTORY }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIRECTORY }}
